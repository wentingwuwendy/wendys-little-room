<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f5f2e9" />
<meta name="description" content="欢迎来到吴雯婷 Wendy Wu 的小房间。在书架里翻阅经历，在桌边聊聊喜欢的事，从一枚冰箱贴出发看世界。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23738061'/%3E%3Ctext x='12' y='46' font-size='42' fill='%23fff9ea' font-family='Georgia'%3Ew%3C/text%3E%3C/svg%3E" />
<title>Wendy’s little room · 吴雯婷的个人网站</title>
</head>
<body><div id="app">
<header class="topbar"><div class="header-actions"><button class="contact-link" data-open="contact">打个招呼 <span>↗</span></button></div></header>
<main>
<section class="intro" aria-labelledby="intro-title"><h1 id="intro-title">你好，我是<br><span>吴雯婷</span><i>Wendy.</i></h1><div class="profile-tags"><span>香港大学 · 商业人工智能</span><span>厦门大学 · 英语 & 统计学</span></div><button class="explore-link" data-open="about">我的简历 <span>↗</span></button></section>
<section id="room-stage" aria-label="可互动的 3D 微缩房间"><canvas id="room-canvas" tabindex="0" aria-label="拖动旋转房间，滚轮或双指缩放；悬停物件会显示白色轮廓，点击打开故事，点击落地灯切换昼夜。键盘加减键缩放，0 恢复视角。也可按 Tab 键选择物件内容。"></canvas><div id="loading">正在给小房间开窗…</div><div id="fallback" hidden>房间暂时无法显示。你仍然可以通过下方入口查看我的经历。</div></section>
<div class="scene-tools"><button id="theme-toggle" aria-pressed="false"><span id="theme-icon">☼</span><span id="theme-label">白日小憩</span><span class="switch-dot"></span></button><button id="reset-view" aria-label="恢复房间初始角度与缩放" title="恢复视角">↺</button></div>
<span id="bear-status" class="sr-only" role="status" aria-live="polite"></span><nav class="keyboard-explore" aria-label="键盘探索房间"><button data-open="experience">实习档案</button><button data-open="projects">项目经历</button><button data-open="about">我的简历</button><button data-open="life">兴趣收藏</button><button data-open="travel">国际经历</button></nav>
<div id="object-tooltip" role="tooltip" hidden></div>
</main>
<footer><span>© <span id="year"></span> WENDY WU</span><span>保持好奇，慢慢生长。<span class="footer-flower">✳</span></span></footer>
<dialog id="story-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span id="dialog-kicker"></span><button id="close-dialog" aria-label="关闭详情">×</button></div><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</div><script type="module" src="/src/main.ts"></script></body></html>
